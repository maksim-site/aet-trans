<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Руководитель компании | АЕТ Транс</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --navy: #031525;
      --cyan: #5bc3ee;
      --muted: #b5c5d1;
      --line: rgba(151, 199, 222, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      background: var(--navy);
    }

    body {
      min-width: 320px;
      margin: 0;
      color: #fff;
      background: var(--navy);
    }

    a {
      color: inherit;
    }

    .director {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: var(--navy);
    }

    .director-media {
      position: absolute;
      z-index: -2;
      inset: 0;
      margin: 0;
    }

    .director-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .director-shade {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(2, 16, 29, 0.98) 0%,
          rgba(2, 16, 29, 0.93) 23%,
          rgba(2, 16, 29, 0.72) 39%,
          rgba(2, 16, 29, 0.2) 55%,
          rgba(2, 16, 29, 0) 68%
        ),
        linear-gradient(180deg, rgba(2, 16, 29, 0.3) 0%, rgba(2, 16, 29, 0) 32%, rgba(2, 16, 29, 0.12) 100%);
    }

    .director-shell {
      width: min(1680px, 100%);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: 28px clamp(28px, 5vw, 84px) clamp(38px, 5vh, 60px);
    }

    .director-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .director-brand {
      display: block;
      width: clamp(210px, 16vw, 268px);
    }

    .director-brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    .director-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      color: #dce7ee;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    .director-back:hover {
      color: #fff;
      transform: translateX(-3px);
    }

    .director-back:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 5px;
    }

    .director-copy {
      width: min(540px, 43vw);
      margin: auto 0;
      padding: clamp(42px, 6vh, 72px) 0 clamp(26px, 4vh, 46px);
      animation: copy-in 700ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .director-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 clamp(20px, 3vh, 30px);
      color: #9adcf7;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .director-kicker::before {
      width: 42px;
      height: 2px;
      background: var(--cyan);
      content: "";
    }

    .director-quote {
      margin: 0;
      padding-left: clamp(20px, 2vw, 30px);
      border-left: 2px solid var(--cyan);
    }

    .director-quote p {
      margin: 0;
      font-size: clamp(29px, 2.45vw, 40px);
      font-weight: 500;
      line-height: 1.12;
      text-wrap: balance;
    }

    .director-meta {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      margin-top: clamp(22px, 3.5vh, 34px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .director-meta::before {
      color: var(--cyan);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 54px;
      line-height: 0.75;
      content: "”";
    }

    .director-meta strong,
    .director-meta small {
      display: block;
    }

    .director-meta strong {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 600;
    }

    .director-meta small {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    @keyframes copy-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1180px) {
      .director-copy {
        width: min(500px, 46vw);
      }

      .director-quote p {
        font-size: clamp(28px, 3.1vw, 38px);
      }
    }

    @media (min-width: 821px) and (max-height: 760px) {
      .director-shell {
        padding-top: 18px;
        padding-bottom: 22px;
      }

      .director-brand {
        width: 210px;
      }

      .director-copy {
        width: min(520px, 42vw);
        padding: 22px 0 14px;
      }

      .director-kicker {
        margin-bottom: 18px;
      }

      .director-quote p {
        font-size: 31px;
      }

      .director-meta {
        margin-top: 20px;
        padding-top: 14px;
      }

      .director-meta::before {
        font-size: 44px;
      }

      .director-meta strong {
        font-size: 16px;
      }
    }

    @media (max-width: 820px) {
      .director {
        min-height: auto;
        overflow: visible;
      }

      .director-media {
        position: relative;
        z-index: 0;
        height: clamp(330px, 46svh, 420px);
      }

      .director-media img {
        object-position: 68% center;
      }

      .director-media::after {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(180deg, rgba(2, 16, 29, 0.36) 0%, rgba(2, 16, 29, 0) 48%, var(--navy) 100%);
      }

      .director-shade {
        display: none;
      }

      .director-shell {
        position: static;
        min-height: auto;
        padding: 0 20px 40px;
      }

      .director-top {
        position: absolute;
        z-index: 2;
        top: 14px;
        right: 16px;
        left: 16px;
      }

      .director-brand {
        width: 142px;
      }

      .director-back {
        width: 44px;
        height: 44px;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(174, 214, 233, 0.34);
        background: rgba(3, 21, 37, 0.42);
        backdrop-filter: blur(10px);
        font-size: 0;
      }

      .director-back span {
        font-size: 18px;
      }

      .director-copy {
        width: 100%;
        max-width: 640px;
        margin: -8px 0 0;
        padding: 14px 0 0;
      }

      .director-kicker {
        margin-bottom: 22px;
        font-size: 11px;
      }

      .director-kicker::before {
        width: 28px;
      }

      .director-quote {
        padding-left: 20px;
      }

      .director-quote p {
        font-size: clamp(22px, 6.1vw, 27px);
        line-height: 1.15;
      }

      .director-meta {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        margin-top: 26px;
        padding-top: 17px;
      }

      .director-meta::before {
        font-size: 42px;
      }

      .director-meta strong {
        font-size: 16px;
      }

      .director-meta small {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .director-copy {
        animation: none;
      }

      .director-back {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="director">
    <figure class="director-media">
      <img
        src="../director-concept/director-office-composite-final.webp"
        width="2400"
        height="1358"
        fetchpriority="high"
        alt="Александр Торгашов, генеральный директор ООО «АЕТ Транс», в рабочем кабинете"
      >
    </figure>
    <div class="director-shade" aria-hidden="true"></div>
    <div class="director-shell">
      <div class="director-top">
        <a class="director-brand" href="../" aria-label="АЕТ Транс, на главную">
          <img src="../../assets/logo-wordmark-light.svg" alt="АЕТ Транс">
        </a>
        <a class="director-back" href="../"><span aria-hidden="true">←</span> На главную</a>
      </div>
      <section class="director-copy">
        <h1 class="director-kicker">Слово руководителя</h1>
        <blockquote class="director-quote">
          <p>Для нас важно не просто организовать перевозку, а сделать весь процесс понятным для клиента. Мы остаёмся на связи на каждом этапе и отвечаем за результат.</p>
          <footer class="director-meta">
            <div>
              <strong>Александр Торгашов</strong>
              <small>Генеральный директор ООО «АЕТ Транс»</small>
            </div>
          </footer>
        </blockquote>
      </section>
    </div>
  </main>
</body>
</html>
